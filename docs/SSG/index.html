<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>노란귤 블로그 SSG 글쓰기 도구</title>
    <meta name="description" content="노란귤 블로그 전용 정적 사이트 생성기 에디터 및 글쓰기 도구">
    <!-- 원본 블로그 스타일시트 링크 -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <!-- SSG 에디터 전용 스타일시트 링크 -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- 상단 컨트롤 네비게이션 바 -->
    <nav class="navbar ssg-navbar">
        <div class="nav-brand" id="nav-logo">
            <span>귤 SSG 에디터</span><span class="brand-dot"></span>
        </div>
        <div class="nav-status-container">
            <span id="backend-status" class="status-badge status-offline">연결 확인 중...</span>
            <button id="btn-select-dir" class="btn btn-secondary" style="display: none;">프로젝트 폴더 선택</button>
            <span id="directory-status" class="dir-path-badge" style="display: none;">폴더가 선택되지 않음</span>
        </div>
        <div class="nav-actions">
            <button id="btn-save" class="btn btn-primary">게시글 저장 & 발행</button>
        </div>
    </nav>

    <!-- 에디터 레이아웃 -->
    <div class="ssg-layout">
        <!-- 좌측: 글 작성 영역 -->
        <section class="editor-pane">
            <div class="editor-card">
                <h2 class="pane-title">게시글 작성</h2>
                
                <div class="form-group">
                    <label for="post-title">제목</label>
                    <input type="text" id="post-title" class="form-control" placeholder="게시글 제목을 입력하세요">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="post-category">카테고리</label>
                        <input type="text" id="post-category" class="form-control" placeholder="General" list="category-datalist">
                        <datalist id="category-datalist">
                            <option value="General"></option>
                            <option value="Graphics"></option>
                            <option value="Web"></option>
                            <option value="Game"></option>
                        </datalist>
                    </div>
                    <div class="form-group">
                        <label for="post-date">작성일</label>
                        <input type="date" id="post-date" class="form-control">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="post-tags">태그 (쉼표로 구분)</label>
                        <input type="text" id="post-tags" class="form-control" placeholder="Welcome, Guide">
                    </div>
                    <div class="form-group">
                        <label for="post-readtime">읽는 시간</label>
                        <input type="text" id="post-readtime" class="form-control" placeholder="3 min read">
                    </div>
                </div>

                <div class="form-group">
                    <label for="post-excerpt">요약 (Excerpt)</label>
                    <textarea id="post-excerpt" class="form-control" rows="2" placeholder="블로그 메인 목록에 표시될 짤막한 요약글을 작성하세요"></textarea>
                </div>

                <div class="form-group editor-body-group">
                    <div class="editor-body-header">
                        <label for="post-body">본문 (Markdown)</label>
                        <span class="editor-tip">마크다운을 지원합니다.</span>
                    </div>
                    <textarea id="post-body" class="form-control text-mono" placeholder="# 환영합니다!&#10;여기에 마크다운 문법으로 글을 작성하세요."></textarea>
                </div>
            </div>
        </section>

        <!-- 우측: 실시간 프리뷰 영역 (실제 블로그 레이아웃 적용) -->
        <section class="preview-pane">
            <div class="preview-header-bar">
                <span class="pane-title">실시간 프리뷰 (블로그 스타일 적용)</span>
            </div>
            
            <div class="preview-frame">
                <!-- 실제 블로그 구조 시뮬레이션 -->
                <div class="blog-layout ssg-preview-layout">
                    <!-- 중앙 콘텐츠 영역만 렌더링 -->
                    <main class="main-content">
                        <section class="post-detail-container">
                            <div class="btn-back">
                                <span>←</span> 목록으로 돌아가기 (프리뷰)
                            </div>
                            <article class="post-article">
                                <header class="detail-header">
                                    <span class="post-category" id="preview-category">Category</span>
                                    <h1 class="detail-title" id="preview-title">게시글 제목</h1>
                                    <div class="detail-meta">
                                        <span id="preview-date">2026-06-15</span>
                                        <span class="meta-dot">•</span>
                                        <span id="preview-readtime">3 min read</span>
                                    </div>
                                </header>
                                <div class="post-content" id="preview-content">
                                    <!-- 렌더링된 마크다운 내용이 들어갑니다 -->
                                </div>
                            </article>
                        </section>
                    </main>

                    <!-- 우측 TOC 영역 시뮬레이션 -->
                    <aside class="toc-sidebar">
                        <div class="toc-card" id="preview-toc-card">
                            <h3 class="toc-title">Table of Contents</h3>
                            <div class="no-toc">목차가 여기에 생성됩니다.</div>
                        </div>
                    </aside>
                </div>
            </div>
        </section>
    </div>

    <!-- 스크립트 모듈 연동 -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
