<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>노란귤 블로그</title>
    <meta name="description" content="노란귤의 개발 블로그입니다.">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <!-- 상단 네비게이션 바 -->
    <nav class="navbar" id="blog-navbar">
        <div class="nav-brand" id="nav-logo">
            <span>노란귤</span><span class="brand-dot"></span>
        </div>

        <div class="nav-actions">
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" class="search-input" placeholder="게시글 검색...">
            </div>
        </div>
    </nav>

    <!-- 레이아웃 컨테이너 -->
    <div class="blog-layout">

        <!-- 좌측 사이드바: 프로필 및 카테고리 -->
        <aside class="profile-sidebar">
            <!-- 프로필 카드 -->
            <div class="profile-card">
                <div class="profile-image-container">
                    <img src="assets/images/profile_avatar.png" alt="Profile Avatar" class="profile-image" id="profile-img">
                </div>
                <h2 class="profile-name">agagtmdtlr</h2>
                <p class="profile-bio">제가 좋아하는 게임,그래픽스,개발 내용을 기록합니다.</p>
                <div class="profile-socials">
                    <a href="https://github.com/agagtmdtlr" target="_blank" class="social-link" title="GitHub">
                        <svg stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 16 16" height="18"
                            width="18" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z">
                            </path>
                        </svg>
                    </a>
                    <a href="mailto:agagtmdtlr@example.com" class="social-link" title="Email">
                        <svg stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 24 24" height="18"
                            width="18" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z">
                            </path>
                        </svg>
                    </a>
                </div>
            </div>

            <!-- 카테고리 카드 -->
            <div class="category-card">
                <h3 class="card-title">Categories</h3>
                <ul class="category-list" id="category-list">
                    <!-- 카테고리 목록이 JS를 통해 동적 생성됩니다 -->
                </ul>
            </div>
        </aside>

        <!-- 중앙 메인 콘텐츠 영역 -->
        <main class="main-content" id="main-content">

            <!-- 1. 게시글 목록 뷰 -->
            <section id="view-list" class="post-list">
                <!-- 게시글 카드들이 JS를 통해 동적으로 주입됩니다 -->
            </section>

            <!-- 2. 게시글 상세 보기 뷰 -->
            <section id="view-detail" class="post-detail-container" style="display: none;">
                <div class="btn-back" id="btn-back-to-list">
                    <span>←</span> 목록으로 돌아가기
                </div>
                <article class="post-article">
                    <header class="detail-header">
                        <span class="post-category" id="detail-category">Category</span>
                        <h1 class="detail-title" id="detail-title">게시글 제목</h1>
                        <div class="detail-meta">
                            <span id="detail-date">2026-06-14</span>
                            <span class="meta-dot">•</span>
                            <span id="detail-readtime">5 min read</span>
                        </div>
                    </header>
                    <div class="post-content" id="detail-content">
                        <!-- 렌더링된 마크다운 HTML이 주입됩니다 -->
                    </div>
                </article>
            </section>

        </main>

        <!-- 우측 사이드바: 목차(TOC) 및 보조 위젯 -->
        <aside class="toc-sidebar">
            <!-- 스크롤 감시용 목차 카드 (게시글 상세 페이지에서 활성화) -->
            <div class="toc-card" id="toc-card">
                <!-- TOC 항목들이 JS를 통해 동적 생성됩니다 -->
            </div>

            <!-- 최신 게시글 요약 위젯 -->
            <div class="widget-card" id="recent-posts-widget">
                <h3 class="card-title">Recent Posts</h3>
                <ul class="widget-post-list" id="widget-recent-list">
                    <!-- 최근 포스트 목록이 동적으로 주입됩니다 -->
                </ul>
            </div>
        </aside>

    </div>

    <!-- 스크립트 모듈 연동 -->
    <script type="module" src="assets/js/app.js"></script>
</body>

</html>
